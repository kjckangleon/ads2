<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0e1420" />

    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(#0e1420, #1d2a3f);
        color: #dfe9f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        z-index: 100;
        transition: opacity 0.5s;
      }
      #splash h1 { letter-spacing: 0.35em; font-weight: 800; margin: 0; }
      #splash p { opacity: 0.7; font-size: 13px; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div id="splash"><h1>FROSTLINE</h1><p>Feed them. Warm them. Build the machine.</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
